<div class="hinting-response" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #413D3A; line-height: 1.6; max-width: 720px;">
  <p style="font-size: 17px; margin: 0 0 20px;">{{ opening }}</p>

  {% for hint in hints %}
  <details style="border: 1px solid #CAC7C7; border-radius: 6px; margin-bottom: 12px; overflow: hidden;">
    <summary style="font-size: 15px; font-weight: 700; color: #007480; padding: 14px 18px; cursor: pointer; background: #faf8f8; list-style: none;">{{ hint.title }}</summary>
    <div class="content" style="font-size: 15px; padding: 18px;">{{ hint.body }}</div>
  </details>
  {% endfor %}

  {% if include_solution %}
  <details style="border: 1px solid #CAC7C7; border-radius: 6px; margin-bottom: 12px; overflow: hidden;">
    <summary style="font-size: 15px; font-weight: 700; color: #B51F1F; padding: 14px 18px; cursor: pointer; background: #fbeeee; list-style: none;">{{ solution.title }}</summary>
    <div class="content" style="font-size: 15px; padding: 18px;">{{ solution.body }}</div>
  </details>
  {% endif %}
</div>
