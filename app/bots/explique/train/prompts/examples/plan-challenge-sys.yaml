- slug: natural-selection
  tags:
    example_dialog_history: |-
      ----AI----
      How would you explain natural selection to someone who's never heard of it?

      ----HUMAN----
      It's when traits that help survival get passed on more, so they become more common over generations.

      ----AI----
      Nice. So if a trait helps survival but isn't heritable, does it spread?

      ----HUMAN----
      No, only heritable traits can, because they're the only ones passed to offspring.

      ----AI----
      Right. And if the environment changes so a previously useful trait becomes harmful?

      ----HUMAN----
      Then it would be selected against and decrease in frequency, since the pressure reversed.
    output: |-
      {
        "points_tested": [
          "Natural selection increases the frequency of survival-enhancing heritable traits",
          "Only heritable traits can be selected for, since non-heritable ones aren't passed on",
          "A trait's selective value depends on the environment and can reverse when conditions change"
        ],
        "reasoning": "The student stated each point and then applied it correctly in an unseen configuration (non-heritable trait, environmental reversal). Every core point has been applied, not merely stated, so the topic is exhausted.",
        "direction": "topic appears exhausted"
      }
