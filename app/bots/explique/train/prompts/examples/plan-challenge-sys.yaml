examples:
- slug: projectile-motion
  tags:
    example_dialog_history: |-
      ----AI----
      How would you explain projectile motion to someone who's never studied it?

      ----HUMAN----
      You throw something and it curves down, because gravity pulls it back to the ground.

      ----AI----
      Right — and what happens to how fast it's moving sideways while it falls?

      ----HUMAN----
      It stays the same, I think. Nothing is pushing it sideways.

      ----AI----
      Exactly. So what shape does the path end up being?

      ----HUMAN----
      A parabola — it drops faster and faster while the sideways part keeps going at a steady rate.
    output: |-
      {
        "points_tested": [
          "A projectile curves downward because gravity keeps acting on it after release",
          "Horizontal velocity is unchanged during the flight, since no horizontal force acts on it",
          "The path is a parabola: steady horizontal motion combined with accelerating vertical motion"
        ],
        "reasoning": "The student has *stated* three points (gravity curves the path, horizontal velocity is unchanged, and the two combine into a parabola) but has not yet *applied* the independence of components in a new configuration. The next direction is a transfer test of that independence.",
        "direction": "Ask whether an object dropped straight down and one thrown horizontally from the same height reach the ground at the same moment."
      }
