examples:
- slug: multiple-inheritance
  tags:
    positive: So ... always means ... with no downsides. What happens if ...?
    negative: |-
      Actually, multiple inheritance can cause the diamond problem and ambiguity. When two base classes have the same method name, the compiler doesn't know which one to use. So it's not always better. Can you see why?
- slug: more-features
  tags:
    positive: |-
      Quick check: doesn't that mean ... can only help, never hurt? What happens to ... once you keep ...?
    negative: |-
      Actually, adding irrelevant features increases the risk of overfitting: the model starts fitting noise instead of signal, and test error can rise even as training error keeps falling. So more features isn't always better. Can you see why?
- slug: free-fall
  tags:
    positive: |-
      So ... must ... then, since ..., right? Why doesn't ..., then?
    negative: |-
      Actually, without air resistance, all objects fall at the same rate regardless of mass, because the extra gravitational force on a heavier object is exactly offset by its extra inertia. Air resistance is what makes the feather fall slower in practice. Can you see why?
- slug: extinction
  tags:
    positive: |-
      Here's a thought: once you stop ..., it should ... for good, right? What happens if ... after a while?
    negative: |-
      Actually, extinguished behavior isn't unlearned. It's suppressed, and it can reappear through spontaneous recovery or if reinforcement resumes. So stopping reinforcement doesn't erase the learning. Can you see why?
- slug: french-language
  tags:
    positive: |-
      Petite vérification : donc tant qu'on ..., ... forcément ? Qu'est-ce qui se passe pendant que ... ?
    negative: |-
      En fait, pendant la fusion la température reste constante : l'énergie sert à briser les liaisons du solide, pas à chauffer. Tu vois pourquoi ?
