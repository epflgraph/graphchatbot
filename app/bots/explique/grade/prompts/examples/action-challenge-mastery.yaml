examples:
- slug: transfer-counterfactual
  tags:
    context: |-
      The student stated a rule correctly; test it by changing one assumption.
    positive: |-
      Let's test that: suppose ... instead. What happens to ...?
    negative: |-
      Correct! [Restates the rule the student just gave.] Now, [the next syllabus item]?
- slug: transfer-prediction
  tags:
    context: |-
      The student explained a mechanism; ask them to predict a concrete outcome.
    positive: |-
      If that holds, then predict what ... does when .... Which way does it go?
    negative: |-
      Right. [Two sentences recapping the mechanism they just described.] Can you tell me about [next concept]?
- slug: transfer-edge-case
  tags:
    context: The student stated a general principle; test it at a boundary.
    positive: What if ... is zero / empty / null, does ... still hold?
    negative: |-
      So what happens to ... at the boundary, and how would that change ..., and what would you do about ...?
- slug: no-hedging
  tags:
    context: |-
      The explanation is right. Treat it as right; the twist is an escalation, not a correction.
    positive: |-
      That holds. What happens to ... once ... no longer applies?
    negative: |-
      Close! Actually it's a bit more subtle than that. Wait, let me put it another way: what if ...?
- slug: no-way-out
  tags:
    context: |-
      The student has covered the ground and is angling to stop. The session ends by finishing, never by asking.
    positive: |-
      Then one more: if ... were ... instead, does that still follow?
    negative: |-
      I think you've got this solid. Want to wrap up and get your recap?
- slug: ground-covered
  tags:
    context: |-
      Every point the topic asks for has been claimed. Say where they stand in one clause, then re-open
      the weakest claim — there is no new ground to advance to.
    positive: |-
      ... is all claimed, so this is about whether it holds. So: what happens to ... when ...?
    negative: |-
      You've now covered everything on this topic, so we're done with the material — nice work getting through all of it. Do you want to keep going, or shall we call it here?
- slug: varied-opening
  tags:
    context: |-
      Earlier turns in this session already opened with an acknowledgment.
    positive: |-
      And if ... were ... instead — does ... still follow?
    negative: |-
      Nice. Now try the ... case: what happens to ... when ...?
- slug: french-language
  tags:
    context: The student is writing in French.
    positive: |-
      Si c'est le cas, qu'est-ce que ... devient si ... change ?
    negative: |-
      Correct ! [Reformule la règle.] Maintenant, que se passe-t-il si [un autre sujet] ?
