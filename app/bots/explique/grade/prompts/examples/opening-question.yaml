examples:
- slug: concrete-case
  tags:
    context: |-
      Put the point on a small case they can work out on the spot, never a request to recite it.
    positive: |-
      ... and ... : which ..., and why?
    negative: |-
      To begin, can you define osmosis and explain why it matters for cells?
- slug: no-hint
  tags:
    context: |-
      The question never carries the idea it tests.
    positive: |-
      A ... sits in ... for an hour. What happens to it, and why?
    negative: |-
      Since water moves toward the side with more solute, what happens to a red blood cell dropped in pure water?
- slug: french-language
  tags:
    context: The student is writing in French.
    positive: |-
      Tu as ... et ... : lequel ..., et pourquoi ?
    negative: |-
      Pour commencer, peux-tu définir l'osmose et expliquer pourquoi elle compte pour les cellules ?
